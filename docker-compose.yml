services:
  backend-django:
    build: ./backend-django
    container_name: django_app
    ports:
      - "8000:8000"
    volumes:
      - ./backend-django:/app
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --reload